# i3blocks config file
#
# Please see man i3blocks for a complete reference!
# The man page is also hosted at http://vivien.github.io/i3blocks
#
# List of valid properties:
#
# align
# color
# command
# full_text
# instance
# interval
# label
# min_width
# name
# separator
# separator_block_width
# short_text
# signal
# urgent

# Global properties
#
# The top properties below are applied to every block, but can be overridden.
# Each block command defaults to the script name to avoid boilerplate.
command=/usr/share/i3blocks/$BLOCK_NAME
separator_block_width=15
markup=none


# Colours: blocks print none and take the bar's statusline colour (muted),
# or one role from i3blocks-color: fg for a live value, accent for a toggle
# that is on, red for an alarm. Glyphs are Font Awesome 7 (see the bar font in
# nix/home.nix). A separator is drawn only after the last block of a group,
# which is the block of the group that never goes empty.

[quote]
label= 
command=random_quote.sh
interval=60

[project-urls]
interval=5
signal=11
command=~/.local/bin/i3-project i3blocks
separator=false

[elly]
interval=5
# || true => don't spam journal with failed to connect
command=~/code/github/chelmertz/elly/contrib/elly_i3blocks.sh "" || true
separator=false

[prometheus]
interval=20
command=~/.local/bin/i3blocks_prometheus
separator=false

[recording]
interval=1
signal=12
command=~/.local/bin/i3blocks_recording.sh
separator=false

[keylog]
interval=5
signal=13
command=~/.local/bin/i3blocks_keylog.sh

# Battery indicator
#
# The battery instance defaults to 0.
[battery]
command=~/.local/bin/battery
interval=30
separator=false

[wttr]
label= 
command=~/.local/bin/i3blocks_wttr.sh
interval=600

# ui, mouse buttons:
# left = previous
# middle  = pause
# right  = next
[mediaplayer]
interval=5
signal=10 # trigger with pkill -SIGRTMIN+10 i3blocks
command=~/.local/bin/i3blocks_spotify.sh

# left click to open google calendar and focus firefox
[time]
command=~/.local/bin/i3blocks_date.sh
interval=5

[redshift]
command=~/.local/bin/i3blocks_redshift.sh 2>/dev/null
interval=30
separator=false

[bluetooth]
command=~/.local/bin/i3blocks_bluetooth.sh
interval=30
separator=false

[screenlayout]
full_text=
command=~/.local/bin/i3blocks_screenlayout.sh 2>/dev/null
separator=false

[colorscheme]
command=~/.local/bin/i3blocks_colorscheme.sh
interval=5
