# i3blocks config file
#
# Please see man i3blocks for a complete reference!
# The man page is also hosted at http://vivien.github.io/i3blocks
#
# List of valid properties:
#
# align
# color
# command
# full_text
# instance
# interval
# label
# min_width
# name
# separator
# separator_block_width
# short_text
# signal
# urgent

# Global properties
#
# The top properties below are applied to every block, but can be overridden.
# Each block command defaults to the script name to avoid boilerplate.
command=/usr/share/i3blocks/$BLOCK_NAME
# Groups are separated by air, never rules: 14px between blocks of a group,
# 24px after the last block of a group (the one that never goes empty).
# Inside a block the unit is one space, and it comes from either the label's
# trailing space or the script, never both; a glyph-only block has no label
# and no space.
separator=false
separator_block_width=14
markup=none


# Colours: blocks print none and take the bar's statusline colour (fg), or one
# role from i3blocks-color: muted for a toggle that is off or a paused track,
# red for an alarm. Glyphs are Font Awesome 7 (see the bar font in nix/home.nix).

[quote]
label= 
command=random_quote.sh
interval=60
separator_block_width=24

[project-urls]
interval=5
signal=11
command=~/.local/bin/i3-project i3blocks

[elly]
interval=5
# || true => don't spam journal with failed to connect
command=~/code/github/chelmertz/elly/contrib/elly_i3blocks.sh "" || true

[prometheus]
interval=20
command=~/.local/bin/i3blocks_prometheus

[recording]
interval=1
signal=12
command=~/.local/bin/i3blocks_recording.sh

[keylog]
interval=5
signal=13
command=~/.local/bin/i3blocks_keylog.sh
separator_block_width=24

# Battery indicator
#
# The battery instance defaults to 0.
[battery]
command=~/.local/bin/battery
interval=30

[wttr]
label= 
command=~/.local/bin/i3blocks_wttr.sh
interval=600
separator_block_width=24

# ui, mouse buttons:
# left = previous
# middle  = pause
# right  = next
[mediaplayer]
interval=5
signal=10 # trigger with pkill -SIGRTMIN+10 i3blocks
command=~/.local/bin/i3blocks_spotify.sh
separator_block_width=24

# left click on any of the three opens google calendar and focuses firefox
[date]
command=~/.local/bin/i3blocks_date.sh day
interval=5

[week]
command=~/.local/bin/i3blocks_date.sh week
interval=60

[clock]
command=~/.local/bin/i3blocks_date.sh clock
interval=5
separator_block_width=24

[redshift]
command=~/.local/bin/i3blocks_redshift.sh 2>/dev/null
interval=30

[bluetooth]
command=~/.local/bin/i3blocks_bluetooth.sh
interval=30

[screenlayout]
full_text=
command=~/.local/bin/i3blocks_screenlayout.sh 2>/dev/null

[colorscheme]
command=~/.local/bin/i3blocks_colorscheme.sh
interval=5
# Right-edge air, replacing the bar's `padding`, which i3bar draws but does not
# count when routing clicks. Part of the block, so clicks stay aligned.
separator_block_width=24
