name: claude-review lint and tests

# On every push that touches claude-review: the lint config carries rules
# (forbidigo: the environment is read only in main.go) that hold only if
# something runs them. The slow suites stay daily in claude-review-slow-tests.
on:
  push:
    paths:
      - "claude-review/**"
      - ".github/workflows/claude-review-lint.yml"
  workflow_dispatch:

permissions: {}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: claude-review
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: claude-review/go.mod

    - name: Tests
      run: go test ./...

    # The version matches the one nix puts on PATH locally.
    - name: Lint
      run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
