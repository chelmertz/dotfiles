name: claude-review slow tests

# Daily rather than on every push: mutation testing reruns the suite once per
# mutant, and the long property run draws 100 times the usual cases. Both run
# locally with `make mutate` and `make props-long` in claude-review/.
on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: claude-review
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: claude-review/go.mod

    - name: Long property run
      run: make props-long

    - name: Mutation testing
      run: make mutate
