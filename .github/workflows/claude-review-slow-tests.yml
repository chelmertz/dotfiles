name: claude-review slow tests

# Daily rather than on every push: mutation testing reruns the suite once per
# mutant, and the long property run draws 100 times the usual cases. Both run
# locally with `make mutate` and `make props-long` in claude-review/.
#
# Two jobs, so each gets its own time limit and one cannot eat the other's:
# on 2026-11-24 mutation with one worker ran past the then-shared 2 h limit.
on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  props-long:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: claude-review
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: claude-review/go.mod

    - name: Long property run
      run: make props-long

  mutation:
    runs-on: ubuntu-latest
    # Four workers on the runner's four cores: on 2026-11-25 they got
    # through 1373 of about 1730 mutants in 90 min.
    timeout-minutes: 180
    permissions:
      contents: read
    defaults:
      run:
        working-directory: claude-review
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: claude-review/go.mod

    - name: Mutation testing
      run: make mutate WORKERS=4
