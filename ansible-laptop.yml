---
# ARCHIVED: Most tasks have moved to nix/home-manager (see nix/home.nix).
# This file documents remaining manual setup that can't be nix-ified on Ubuntu.
#
# Docker setup (requires root/system-level integration):
#   sudo apt install apt-transport-https ca-certificates curl gnupg lsb-release
#   # Add Docker GPG key and repo (see https://docs.docker.com/engine/install/ubuntu/)
#   sudo apt install docker-ce docker-ce-cli containerd.io docker-compose
#   sudo usermod -aG docker ch
#
# Video group (for brightnessctl without sudo):
#   sudo usermod -aG video ch
#
# Input group (for keylog to read /dev/input/event* without root — see keylogger/):
#   sudo usermod -aG input ch
#
# keyd (kernel-level key remap; replaces xcape + setxkbmap caps:ctrl_modifier so
# keylog sees the real Esc/Ctrl — see keyd/default.conf). Not in apt; build it:
#   git clone https://github.com/rvaiya/keyd && cd keyd && make && sudo make install
#   sudo cp <dotfiles>/keyd/default.conf /etc/keyd/default.conf
#   sudo systemctl enable --now keyd
#   sudo keyd reload   # after any config change; `sudo keyd monitor` to verify
#   # then drop caps:ctrl_modifier + xcape from .i3/config and `xcape` from nix/home.nix
#
# Nix daemon settings (/etc/nix/nix.conf, root-owned — home-manager's nix.settings
# writes the *user* nix.conf, which the daemon ignores for all three of these):
#   max-jobs defaults to 1, so every local build runs one at a time on 16 cores.
#   Without ch in trusted-users, any substituter or option set as ch is ignored.
#   auto-optimise-store hardlinks duplicate files; it was saving nothing.
#     sudo tee -a /etc/nix/nix.conf <<'EOF'
#     max-jobs = 8
#     trusted-users = root ch
#     auto-optimise-store = true
#     EOF
#     sudo systemctl restart nix-daemon
#   On NixOS this becomes nix.settings.{max-jobs,trusted-users,auto-optimise-store}.
#
# Emacs/Doom (kept as apt PPA until next machine):
#   sudo add-apt-repository ppa:kelleyk/emacs
#   sudo apt install emacs27
#   git clone https://github.com/hlissner/doom-emacs.git ~/.emacs.d
#   ~/.emacs.d/bin/doom install
